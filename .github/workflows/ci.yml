name: CI (llama-tq)

# Linux CPU build with every tool and test, warnings as errors, then the main test suite.
# The CUDA kernels are checked on GPUs outside of CI (test-backend-ops against the CPU backend).
on:
  workflow_dispatch:
  push:
    branches:
      - turboquant
    paths: ['**/CMakeLists.txt', '**/*.cmake', '**/*.h', '**/*.hpp', '**/*.c', '**/*.cpp', '**/*.cu', '**/*.cuh',
            'models/templates/**', '.github/workflows/ci.yml']
  pull_request:
    types: [opened, synchronize, reopened]
    paths: ['**/CMakeLists.txt', '**/*.cmake', '**/*.h', '**/*.hpp', '**/*.c', '**/*.cpp', '**/*.cu', '**/*.cuh',
            'models/templates/**', '.github/workflows/ci.yml']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  linux-cpu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: ccache
        uses: ggml-org/ccache-action@v1.2.21
        with:
          key: ci-linux-cpu
          evict-old-files: 1d

      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential libssl-dev

      - name: Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF -DLLAMA_FATAL_WARNINGS=ON \
            -DLLAMA_BUILD_TESTS=ON -DLLAMA_BUILD_EXAMPLES=ON -DLLAMA_BUILD_TOOLS=ON -DLLAMA_BUILD_SERVER=ON
          cmake --build build -j $(nproc)

      - name: Test
        run: |
          cd build
          ctest -L main --output-on-failure -j $(nproc) --timeout 900
