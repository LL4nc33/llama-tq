name: Release

on:
  workflow_dispatch: # allows manual triggering
    inputs:
      create_release:
        description: 'Create new release'
        required: true
        type: boolean
  # manual only: Actions -> Release -> Run workflow on the turboquant branch, with "Create new release" ticked

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false # a second manual start waits instead of killing a running build

env:
  BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
  CMAKE_ARGS: "-DLLAMA_BUILD_EXAMPLES=ON -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_TOOLS=ON -DLLAMA_BUILD_SERVER=ON -DGGML_RPC=ON"

jobs:

  ubuntu-cpu:
    strategy:
      fail-fast: false
      matrix:
        include:
          - build: 'x64'
            os: ubuntu-22.04
          - build: 'arm64'
            os: ubuntu-24.04-arm
          # s390x dropped: its runners sit queued for an hour+ and the release
          # job depends on ubuntu-cpu, so a stuck s390x build blocks every
          # release. This fork ships x64/arm64 CPU + the CUDA artifacts; s390x
          # is out of scope.

    runs-on: ${{ matrix.os }}

    steps:
      - name: Clone
        id: checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: ccache
        if: ${{ matrix.build != 's390x' }}
        uses: ggml-org/ccache-action@v1.2.21
        with:
          key: ubuntu-cpu-${{ matrix.build }}
          evict-old-files: 1d

      - name: Dependencies
        id: depends
        run: |
          sudo apt-get update
          sudo apt-get install build-essential libssl-dev

      - name: Toolchain workaround (GCC 14)
        if: ${{ contains(matrix.os, 'ubuntu-24.04') }}
        run: |
          sudo apt-get install -y gcc-14 g++-14
          echo "CC=gcc-14" >> "$GITHUB_ENV"
          echo "CXX=g++-14" >> "$GITHUB_ENV"

      - name: Determine tag name
        id: tag
        uses: ./.github/actions/get-tag-name

      - name: Build
        id: cmake_build
        run: |
          cmake -B build \
            -DCMAKE_INSTALL_RPATH='$ORIGIN' \
            -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON \
            -DGGML_BACKEND_DL=ON \
            -DGGML_NATIVE=OFF \
            -DGGML_CPU_ALL_VARIANTS=ON \
            -DLLAMA_FATAL_WARNINGS=ON \
            -DLLAMA_TQ_VERSION=${{ steps.tag.outputs.name }} \
            ${{ env.CMAKE_ARGS }}
          cmake --build build --config Release -j $(nproc)

      - name: Pack artifacts
        id: pack_artifacts
        run: |
          cp LICENSE ./build/bin/
          tar -czvf llama-${{ steps.tag.outputs.name }}-bin-ubuntu-${{ matrix.build }}.tar.gz --transform "s,./,llama-${{ steps.tag.outputs.name }}/," -C ./build/bin .

      - name: Check archive
        run: bash scripts/check-release-archive.sh llama-${{ steps.tag.outputs.name }}-bin-ubuntu-${{ matrix.build }}.tar.gz cpu ${{ steps.tag.outputs.name }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          path: llama-${{ steps.tag.outputs.name }}-bin-ubuntu-${{ matrix.build }}.tar.gz
          name: llama-bin-ubuntu-${{ matrix.build }}.tar.gz


  ubuntu-vulkan:
    strategy:
      fail-fast: false
      matrix:
        include:
          - build: 'x64'
            os: ubuntu-22.04
          - build: 'arm64'
            os: ubuntu-24.04-arm

    runs-on: ${{ matrix.os }}

    steps:
      - name: Clone
        id: checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: ccache
        uses: ggml-org/ccache-action@v1.2.21
        with:
          key: ubuntu-vulkan-${{ matrix.build }}
          evict-old-files: 1d

      - name: Dependencies
        id: depends
        run: |
          if [[ "${{ matrix.os }}" =~ "ubuntu-22.04" ]]; then
            wget -qO - https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo apt-key add -
            sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-jammy.list https://packages.lunarg.com/vulkan/lunarg-vulkan-jammy.list
            sudo apt-get update -y
            sudo apt-get install -y build-essential mesa-vulkan-drivers vulkan-sdk libssl-dev
          else
            sudo apt-get update -y
            sudo apt-get install -y gcc-14 g++-14 build-essential glslc libvulkan-dev spirv-headers libssl-dev ninja-build
            echo "CC=gcc-14" >> "$GITHUB_ENV"
            echo "CXX=g++-14" >> "$GITHUB_ENV"
          fi

      - name: Determine tag name
        id: tag
        uses: ./.github/actions/get-tag-name

      - name: Build
        id: cmake_build
        run: |
          cmake -B build \
            -DCMAKE_INSTALL_RPATH='$ORIGIN' \
            -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON \
            -DGGML_BACKEND_DL=ON \
            -DGGML_NATIVE=OFF \
            -DGGML_CPU_ALL_VARIANTS=ON \
            -DGGML_VULKAN=ON \
            -DLLAMA_TQ_VERSION=${{ steps.tag.outputs.name }} \
            ${{ env.CMAKE_ARGS }}
          cmake --build build --config Release -j $(nproc)

      - name: Pack artifacts
        id: pack_artifacts
        run: |
          cp LICENSE ./build/bin/
          tar -czvf llama-${{ steps.tag.outputs.name }}-bin-ubuntu-vulkan-${{ matrix.build }}.tar.gz --transform "s,./,llama-${{ steps.tag.outputs.name }}/," -C ./build/bin .

      - name: Check archive
        run: bash scripts/check-release-archive.sh llama-${{ steps.tag.outputs.name }}-bin-ubuntu-vulkan-${{ matrix.build }}.tar.gz vulkan ${{ steps.tag.outputs.name }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          path: llama-${{ steps.tag.outputs.name }}-bin-ubuntu-vulkan-${{ matrix.build }}.tar.gz
          name: llama-bin-ubuntu-vulkan-${{ matrix.build }}.tar.gz


  ubuntu-cuda:
    runs-on: ubuntu-24.04
    # Build inside the official NVIDIA CUDA devel image so nvcc + cuBLAS are
    # present without the apt-repo lottery. Jimver/cuda-toolkit on ubuntu-24.04
    # cannot install 12.4 (no installation candidate in the ubuntu2404 repo) and
    # mangles dev package names — building in the container sidesteps both.
    # One archive per GPU generation, each with native code for it (a single fat binary with all architectures
    # would take several times as long as one runner job may run): Turing also carries PTX, so it JIT-runs on
    # anything newer; Ampere covers sm_80 (A100) and sm_86 (RTX 30); Blackwell carries PTX for future GPUs.
    container: nvidia/cuda:12.8.1-devel-ubuntu24.04

    strategy:
      fail-fast: false
      matrix:
        cuda: ["12.8"]
        gpu:
          - { name: sm75,  archs: "75-real;75-virtual" }
          - { name: sm86,  archs: "80-real;86-real" }
          - { name: sm89,  archs: "89-real" }
          - { name: sm120, archs: "120-real;120-virtual" }

    steps:
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y build-essential cmake ninja-build git libcurl4-openssl-dev ccache
          # Inside the container the checkout dir is owned by a different uid
          # than the one running git, so git refuses with "dubious ownership"
          # (breaks the get-tag-name action). Mark the workspace safe.
          git config --global --add safe.directory '*'

      - name: Clone
        id: checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: ccache
        uses: ggml-org/ccache-action@v1.2.21
        with:
          key: ubuntu-cuda-${{ matrix.cuda }}-${{ matrix.gpu.name }}
          evict-old-files: 1d

      - name: Determine tag name
        id: tag
        uses: ./.github/actions/get-tag-name

      - name: Build
        id: cmake_build
        run: |
          # The devel container ships libcuda.so only as a stub under
          # lib64/stubs (no driver in the image). Put it on LIBRARY_PATH so the
          # linker resolves the CUDA driver symbols (cuMemCreate, cuMemMap, ...);
          # at runtime they bind to the host's real driver.
          export LIBRARY_PATH="/usr/local/cuda/lib64/stubs:${LIBRARY_PATH:-}"
          # $ORIGIN: the binaries find the bundled libllama/libggml next to them from any directory (the default
          # build RUNPATH is the CI checkout path). No NCCL: users rarely have it, and -sm tensor reduces across GPUs
          # through host memory without it.
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_RPATH='$ORIGIN' \
            -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON \
            -DGGML_CUDA=ON \
            -DGGML_CUDA_NCCL=OFF \
            -DCMAKE_CUDA_ARCHITECTURES="${{ matrix.gpu.archs }}" \
            -DCMAKE_EXE_LINKER_FLAGS="-Wl,--allow-shlib-undefined" \
            -DLLAMA_TQ_VERSION=${{ steps.tag.outputs.name }} \
            ${{ env.CMAKE_ARGS }}
          # Cap parallelism: nvcc compiling the TurboQuant template instances for
          # the TQ kernels peaks at ~3-4 GB per job; -j $(nproc) (4 on the runner) blew
          # past the 16 GB runner RAM and the build got OOM-killed (exit 137) at
          # ~74 min. -j2 keeps peak memory in budget; ccache covers repeat runs.
          cmake --build build --config Release -j 2

      - name: Pack artifacts
        id: pack_artifacts
        run: |
          cp LICENSE ./build/bin/
          tar -czvf llama-${{ steps.tag.outputs.name }}-bin-ubuntu-cuda-${{ matrix.cuda }}-${{ matrix.gpu.name }}-x64.tar.gz --transform "s,./,llama-${{ steps.tag.outputs.name }}/," -C ./build/bin .

      - name: Check archive
        run: bash scripts/check-release-archive.sh llama-${{ steps.tag.outputs.name }}-bin-ubuntu-cuda-${{ matrix.cuda }}-${{ matrix.gpu.name }}-x64.tar.gz cuda ${{ steps.tag.outputs.name }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          path: llama-${{ steps.tag.outputs.name }}-bin-ubuntu-cuda-${{ matrix.cuda }}-${{ matrix.gpu.name }}-x64.tar.gz
          name: llama-bin-ubuntu-cuda-${{ matrix.cuda }}-${{ matrix.gpu.name }}-x64.tar.gz


  release:
    if: ${{ github.event.inputs.create_release == 'true' && github.ref == 'refs/heads/turboquant' }}

    # Fine-grant permission
    # https://docs.github.com/en/actions/security-for-github-actions/security-guides/automatic-token-authentication#modifying-the-permissions-for-the-github_token
    permissions:
        contents: write # for creating release

    runs-on: ubuntu-slim

    needs:
      - ubuntu-cpu
      - ubuntu-vulkan
      - ubuntu-cuda

    steps:
      - name: Clone
        id: checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Determine tag name
        id: tag
        uses: ./.github/actions/get-tag-name

      - name: Download artifacts
        id: download-artifact
        uses: actions/download-artifact@v7
        with:
          path: ./artifact
          merge-multiple: true

      - name: Move artifacts
        id: move_artifacts
        run: |
          mkdir -p release
          mv -v artifact/*.tar.gz release
          # every archive of the build matrix: CPU and Vulkan for x64 and arm64, CUDA for four GPU generations
          n=$(ls release/*.tar.gz | wc -l)
          [ "$n" -eq 8 ] || { echo "expected 8 archives, got $n"; exit 1; }

      - name: Create release
        id: create_release
        uses: ggml-org/action-create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          commitish: ${{ github.sha }}
          release_name: llama-tq ${{ steps.tag.outputs.name }}
          body: |
            Changes: [CHANGELOG.md](https://github.com/LL4nc33/llama-tq/blob/${{ steps.tag.outputs.name }}/CHANGELOG.md)

            **Linux (x86-64):**
            - [Ubuntu x64 (CPU)](https://github.com/LL4nc33/llama-tq/releases/download/${{ steps.tag.outputs.name }}/llama-${{ steps.tag.outputs.name }}-bin-ubuntu-x64.tar.gz)
            - [Ubuntu x64 (Vulkan)](https://github.com/LL4nc33/llama-tq/releases/download/${{ steps.tag.outputs.name }}/llama-${{ steps.tag.outputs.name }}-bin-ubuntu-vulkan-x64.tar.gz)
            - Ubuntu x64, CUDA 12.8: [Turing, RTX 20 / T4 (+ PTX for newer GPUs)](https://github.com/LL4nc33/llama-tq/releases/download/${{ steps.tag.outputs.name }}/llama-${{ steps.tag.outputs.name }}-bin-ubuntu-cuda-12.8-sm75-x64.tar.gz) · [Ampere, RTX 30 / A100](https://github.com/LL4nc33/llama-tq/releases/download/${{ steps.tag.outputs.name }}/llama-${{ steps.tag.outputs.name }}-bin-ubuntu-cuda-12.8-sm86-x64.tar.gz) · [Ada, RTX 40 / L4](https://github.com/LL4nc33/llama-tq/releases/download/${{ steps.tag.outputs.name }}/llama-${{ steps.tag.outputs.name }}-bin-ubuntu-cuda-12.8-sm89-x64.tar.gz) · [Blackwell, RTX 50 / RTX PRO 6000](https://github.com/LL4nc33/llama-tq/releases/download/${{ steps.tag.outputs.name }}/llama-${{ steps.tag.outputs.name }}-bin-ubuntu-cuda-12.8-sm120-x64.tar.gz)

            **Linux (arm64):**
            - [Ubuntu arm64 (CPU)](https://github.com/LL4nc33/llama-tq/releases/download/${{ steps.tag.outputs.name }}/llama-${{ steps.tag.outputs.name }}-bin-ubuntu-arm64.tar.gz)
            - [Ubuntu arm64 (Vulkan)](https://github.com/LL4nc33/llama-tq/releases/download/${{ steps.tag.outputs.name }}/llama-${{ steps.tag.outputs.name }}-bin-ubuntu-vulkan-arm64.tar.gz)

            Docker (CPU, amd64): `ghcr.io/ll4nc33/llama-tq:server` (also `full` / `light`).
            Pick the CUDA archive for your GPU generation; the Turing archive also runs on newer GPUs through PTX (slower first start). Other architectures: build from source.
            The CUDA archives need an NVIDIA driver for CUDA 12.8 (570 or newer) and the CUDA 12 runtime libraries `libcudart.so.12` and `libcublas.so.12` (e.g. the packages `cuda-cudart-12-8` and `libcublas-12-8` from NVIDIA's repository).

      - name: Upload release
        id: upload_release
        uses: actions/github-script@v8
        with:
          github-token: ${{secrets.GITHUB_TOKEN}}
          script: |
            const path = require('path');
            const fs = require('fs');
            const release_id = '${{ steps.create_release.outputs.id }}';
            for (let file of await fs.readdirSync('./release')) {
              if (path.extname(file) === '.zip' || file.endsWith('.tar.gz')) {
                console.log('uploadReleaseAsset', file);
                await github.rest.repos.uploadReleaseAsset({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  release_id: release_id,
                  name: file,
                  data: await fs.readFileSync(`./release/${file}`)
                });
              }
            }
