[environment]
extra-paths = ["./gguf-py", "./examples/model-conversion/scripts", "./tools/server/tests"]
python-version = "3.10"

[rules]
deprecated = "warn"

[src]
exclude = [
    "./tools/mtmd/legacy-models/**",
    # TurboQuant fork: research/PoC scripts and vendored upstream benchmarks.
    # In-tree for reproducibility, but missing third-party deps (jieba,
    # fuzzywuzzy, rouge, wonderwords, ...) and not on the production path.
    "./tests/trellis-phase1/**",
    "./bench/harness/vendor/**",
]

[[overrides]]
include = [
    "./tools/server/tests/**",
]

[overrides.rules]
unresolved-reference = "ignore"
unresolved-import = "ignore"
unresolved-attribute = "ignore"

[[overrides]]
include = [
    "./examples/pydantic_models_to_grammar.py",
]

[overrides.rules]
unsupported-operator = "ignore"
not-subscriptable = "ignore"
