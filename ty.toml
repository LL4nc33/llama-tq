[environment]
extra-paths = ["./gguf-py", "./examples/model-conversion/scripts", "./tools/server/tests"]
python-version = "3.10"

[rules]
deprecated = "warn"

[src]
exclude = [
    "./tools/mtmd/legacy-models/**",
    # TurboQuant fork: research/PoC scripts, calibration tools, and
    # vendored upstream benchmarks. In-tree for reproducibility, but
    # missing third-party deps (jieba, fuzzywuzzy, rouge, wonderwords, ...)
    # and not part of the build.
    "./tests/trellis-phase1/**",
    "./bench/**",
    "./scripts/calibrate_ktq_codebook.py",
    "./scripts/tq_calibrate_outliers.py",
    # PyTorch QLoRA reference for the fine-tuning comparison; needs peft and bitsandbytes, which the CI does not install
    "./examples/training/termine/peft_termine.py",
]

[[overrides]]
include = [
    "./tools/server/tests/**",
]

[overrides.rules]
unresolved-reference = "ignore"
unresolved-import = "ignore"
unresolved-attribute = "ignore"

[[overrides]]
include = [
    "./examples/pydantic_models_to_grammar.py",
]

[overrides.rules]
unsupported-operator = "ignore"
not-subscriptable = "ignore"
